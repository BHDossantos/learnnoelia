name: LearnNoelia Native Builds

# Validation only: no signing identities, store uploads, or deployment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'mobile/**'
      - 'scripts/mobile/**'
      - 'src/app/legal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learnnoelia-native.yml'
  push:
    branches: [claude/language-learning-app-vfwbQ, brand/learnnoelia-mobile]
    paths:
      - 'capacitor.config.ts'
      - 'mobile/**'
      - 'scripts/mobile/**'
      - 'src/app/legal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learnnoelia-native.yml'

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 scripts/mobile/prepare.py android
      - name: Generate branded Android assets
        run: npx @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#0e1022' --iconBackgroundColorDark '#0e1022' --splashBackgroundColor '#0e1022' --splashBackgroundColorDark '#0e1022'
      - name: Compile debug APK and unsigned release bundle
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug
      - name: Verify Android package identity and target SDK
        run: |
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -x "$AAPT"
          test -f "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.learnnoelia.app'"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'$/\1/p")"
          test "${TARGET:-0}" -ge 36
          echo "Android debug APK target SDK: $TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: learnnoelia-android-validation-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: learnnoelia-android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: python3 scripts/mobile/prepare.py ios
      - name: Generate branded iOS assets
        run: npx @capacitor/assets@3 generate --ios --assetPath assets --iconBackgroundColor '#0e1022' --splashBackgroundColor '#0e1022' --splashBackgroundColorDark '#0e1022'
      # Capacitor 8 generates a Swift Package Manager project by default.
      # There is no Podfile, so do not run pod install here.
      - name: Verify current App Store toolchain baseline
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          test "${SDK%%.*}" -ge 26
          echo "iOS simulator SDK: $SDK"
      - name: Compile iOS simulator app without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/noelia-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Install and launch the unsigned simulator build
        run: |
          APP="$RUNNER_TEMP/noelia-derived/Build/Products/Debug-iphonesimulator/App.app"
          ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          test "$ID" = "com.learnnoelia.app"
          DEVICE="$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next((d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")), ""))')"
          if [ -z "$DEVICE" ]; then
            DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')"
            xcrun simctl boot "$DEVICE"
          fi
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$ID"
      - name: Package simulator app
        run: |
          APP="$RUNNER_TEMP/noelia-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/learnnoelia-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: learnnoelia-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/learnnoelia-simulator.zip
          if-no-files-found: error
          retention-days: 14
